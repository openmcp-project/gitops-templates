components:
  - name: "${REPO_URL}"
    version: "${VERSION}"
    labels:
      - name: "org.opencontainers.image.source"
        value: "${REPO_URL}"
    provider:
      name: openmcp-project
    resources:
      - name: openmcp
        type: fileSystem
        input:
          type: dir
          path: ./templates/openmcp
      - name: fluxcd
        type: fileSystem
        input:
          type: dir
          path: ./templates/fluxcd
      - name: gitops-templates
        type: blob
        version: ${VERSION}
        access:
          type: gitHub
          repoUrl: "${REPO_URL}"
          commit: "${COMMIT}"
