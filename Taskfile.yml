version: '3'

includes:
  release:
    taskfile: hack/common/tasks_rls.yaml
    aliases:
    - rls
    - r

  tools:
    taskfile: hack/common/tasks_tools.yaml
    aliases:
      - tools
      - t

vars:
  MODULE_NAME: "gitops-templates"
  REPO_URL: "github.com/openmcp-project/gitops-templates"
  ROOT_DIR2: '{{.ROOT_DIR | trimSuffix "/common" | trimSuffix "/hack"}}'
  VERSION:
    sh: 'cat VERSION'
  COMMIT:
    sh: '( cd "{{.ROOT_DIR2}}"; git rev-parse HEAD )'
  TASKFILE_DIR2:
    sh: 'if [[ "{{.TASKFILE_DIR}}" == "{{.ROOT_DIR2}}" ]] || [[ "{{.TASKFILE_DIR}}" == "" ]]; then echo -n "{{.ROOT_DIR2}}/hack/common"; else echo -n "{{.TASKFILE_DIR}}"; fi'
  LOCALBIN: '{{ env "LOCALBIN" | default ( .LOCALBIN | default (print .ROOT_DIR2 "/bin") ) }}'
  LOCALTMP: '{{ env "LOCALTMP" | default ( .LOCALTMP | default (print .ROOT_DIR2 "/tmp") ) }}'
  JQ: '{{ .JQ | default (print .LOCALBIN "/jq") }}'
  HELM: '{{ .HELM | default (print .LOCALBIN "/helm") }}'
  YAML2JSON: '{{ .YAML2JSON | default (print .LOCALBIN "/yaml2json") }}'
  OCM: '{{ .OCM | default (print .LOCALBIN "/ocm") }}'
  OS: '{{OS}}'
  ARCH: '{{ARCH}}'
  OCM_SIGNING_CONFIG: '{{.ROOT_DIR2}}/signing.yaml'
  OCM_COMPONENT_DIR: '{{.LOCALTMP}}/component'
  OCM_COMPONENT: '{{.REPO_URL}}:{{.VERSION}}'
  ENVTEST: '{{ .ENVTEST | default (print .LOCALBIN "/setup-envtest") }}'

tasks:
  build:
    deps:
    - tools:ocm
    - tools:localtmp
    requires:
      vars:
      - VERSION
      - REPO_URL
    desc: Build ocm component
    env:
      VERSION: '{{.VERSION}}'
      COMMIT: '{{.COMMIT}}'
      REPO_URL: '{{.REPO_URL}}'
    cmds:
      - rm -rf "{{.OCM_COMPONENT_DIR}}"
      - |
        "{{.OCM}}" add cv \
            --constructor "{{.ROOT_DIR2}}/component-constructor.yaml" \
            --repository "ctf::{{.OCM_COMPONENT_DIR}}"

  sign:
    deps:
    - tools:ocm
    desc: Sign the ocm component keyless with Sigstore. It must have been built before.
    cmds:
      - '"{{.OCM}}" sign cv --config "{{.OCM_SIGNING_CONFIG}}" "ctf::{{.OCM_COMPONENT_DIR}}//{{.OCM_COMPONENT}}"'

  lint:
    desc: Lint YAML files in templates directory
    cmds:
      - yamllint templates

  push:
    deps:
    - tools:ocm
    desc: Push to OCM Registry. Fails if the version exists, unless OVERWRITE_COMPONENTS is "true".
    run: once
    requires:
      vars:
      - VERSION
      - LOCALTMP
    env:
      OCM_TARGET_REF: '{{.COMPONENT_REGISTRY}}//{{.OCM_COMPONENT}}'
    cmds:
      # ocm replaces existing versions and has no flag to prevent it.
      - |
        if [ "${OVERWRITE_COMPONENTS:-false}" = "true" ]; then
          exit 0
        fi
        if "{{.OCM}}" get cv "$OCM_TARGET_REF"; then
          echo "$OCM_TARGET_REF already exists. Set OVERWRITE_COMPONENTS to 'true' to overwrite it." >&2
          exit 1
        fi
      - '"{{.OCM}}" transfer cv "ctf::{{.OCM_COMPONENT_DIR}}//{{.OCM_COMPONENT}}" "{{.COMPONENT_REGISTRY}}"'
    vars:
      COMPONENT_REGISTRY:
        sh: 'PROJECT_ROOT="{{.ROOT_DIR2}}" hack/common/get-registry.sh --component'

  flux:
    desc: Renders the latest flux template using the flux cli
    cmds:
      - |
        flux install --export \
        --components-extra="image-reflector-controller,image-automation-controller" \
        > components.yaml
    dir: ./templates/fluxcd/templates/resources

  pull:
    desc: Pulls the resources from the gitops-template ocm.
    cmds:
      - |
        ocm download resources \
        --downloader ocm/dirtree \
        --repo OCIRegistry::ghcr.io/n3rdc4ptn/ocm \
        github.com/openmcp-project/gitops-templates:0.0.2 \
        openmcp fluxcd

  template:
    desc: Testing command just to show the templates
    cmds:
      - |
        helm template --output-dir {{.OUTPUT_DIR}} \
        --set openmcpOperator.image="ghcr.io/openmcp-project/images/openmcp-operator" \
        --set openmcpOperator.tag="latest" \
        ./github.com/openmcp-project/gitops-templates/0.0.2/openmcp
      - |
        helm template --output-dir {{.OUTPUT_DIR}} \
        --set openmcpOperator.image="ghcr.io/openmcp-project/images/openmcp-operator" \
        --set openmcpOperator.tag="latest" \
        ./github.com/openmcp-project/gitops-templates/0.0.2/openmcp
    vars:
      OUTPUT_DIR: "output"

  version:
    desc: Prints the current version of the project
    cmds:
      - cat VERSION
