extends: default

# Helm template expressions {{ }} are valid Go template syntax but not valid
# YAML. Exclude the rendered template dirs and only lint chart metadata files.
ignore: |
  templates/fluxcd/templates/
  templates/openmcp/templates/

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  line-length:
    max: 200
  truthy: disable
